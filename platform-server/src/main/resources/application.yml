# 平台服务仅绑定本机回环地址，避免对外暴露控制面。
server:
  address: 127.0.0.1
  port: 17890

spring:
  application:
    name: platform-server
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: io.llmplatform.repository.handler
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"
  global-config:
    db-config:
      id-type: input

llm:
  platform:
    data-dir: ${user.home}/.llm-platform
    bind-host: 127.0.0.1
  llamafile:
    binary-path: ""
    host: 127.0.0.1
    # 不用 8080 等常见端口，避免被本机其它程序抢占导致误判就绪
    port: 17891
    context-size: 4096
    threads: 4
    gpu-layers: 0
